<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif">
  <rect x="0" y="0" width="1280" height="400" fill="#ffffff"/>

  <text x="640" y="52" font-size="26" font-weight="bold" fill="#1a202c" text-anchor="middle">What the check request looks like</text>
  <text x="640" y="86" font-size="15" fill="#5a6a80" text-anchor="middle">only the orange segment is new: the server already computed the green and blue parts</text>

  <!-- segment 1: reused prefix (green, the largest) -->
  <rect x="40" y="140" width="580" height="100" rx="10" fill="#eefaf3" stroke="#22a06b" stroke-width="2"/>
  <text x="330" y="176" font-size="20" font-weight="bold" fill="#1e7a4c" text-anchor="middle">reused prefix</text>
  <text x="330" y="208" font-size="15" fill="#5a6a80" text-anchor="middle">system + tools + messages (verbatim)</text>

  <!-- segment 2: the reply the server already generated -->
  <rect x="640" y="140" width="260" height="100" rx="10" fill="#eef3fb" stroke="#3468b5" stroke-width="2"/>
  <text x="770" y="176" font-size="20" font-weight="bold" fill="#24508f" text-anchor="middle">the last reply</text>
  <text x="770" y="208" font-size="15" fill="#5a6a80" text-anchor="middle">already in the server KV</text>

  <!-- segment 3: tail instruction (the only new part) -->
  <rect x="920" y="140" width="320" height="100" rx="10" fill="#fdeacc" stroke="#e8850c" stroke-width="2"/>
  <text x="1080" y="176" font-size="20" font-weight="bold" fill="#9a4d00" text-anchor="middle">tail instruction</text>
  <text x="1080" y="208" font-size="15" fill="#5a6a80" text-anchor="middle">draft + budget + patch rules</text>

  <!-- captions: the mechanics that make the reuse hold -->
  <text x="640" y="300" font-size="15" fill="#5a6a80" text-anchor="middle">the three segments are a strict continuation of the last request, so the server reuses its KV</text>
  <text x="640" y="328" font-size="15" fill="#5a6a80" text-anchor="middle">request-level parameters (chat_template_kwargs / max_tokens) come from that request too: they drive template rendering and the cache key</text>
  <text x="640" y="356" font-size="15" fill="#5a6a80" text-anchor="middle">reuse is block-aligned (vLLM 16 tok / FastLLM 2048 tok); the tail remainder is prefilled as usual</text>
</svg>
