<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 790" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif">
  <rect x="0" y="0" width="1280" height="790" fill="#ffffff"/>

  <text x="640" y="52" font-size="26" font-weight="bold" fill="#1a202c" text-anchor="middle">On failure: a cancel stops, everything else degrades</text>
  <text x="640" y="86" font-size="15" fill="#5a6a80" text-anchor="middle">By default any non-cancel failure hands the compaction back to pi, with a notice</text>

  <!-- trigger chip (gray) -->
  <rect x="270" y="116" width="300" height="44" rx="10" fill="#f7f9fb" stroke="#94a3b8" stroke-width="2"/>
  <text x="420" y="145" font-size="20" font-weight="bold" fill="#2d3748" text-anchor="middle">check failed</text>

  <line x1="420" y1="160" x2="420" y2="166" stroke="#718096" stroke-width="2.5"/>
  <polygon points="412,166 428,166 420,180" fill="#718096"/>

  <!-- U: the user-cancel short circuit -->
  <rect x="270" y="180" width="300" height="68" rx="10" fill="#f7f9fb" stroke="#94a3b8" stroke-width="2"/>
  <text x="420" y="208" font-size="20" font-weight="bold" fill="#2d3748" text-anchor="middle">user cancelled?</text>
  <text x="420" y="230" font-size="15" fill="#5a6a80" text-anchor="middle">no retry, no degrade</text>

  <line x1="420" y1="248" x2="420" y2="286" stroke="#718096" stroke-width="2.5"/>
  <polygon points="412,286 428,286 420,300" fill="#718096"/>
  <text x="434" y="278" font-size="15" fill="#5a6a80">no</text>

  <line x1="570" y1="214" x2="856" y2="214" stroke="#718096" stroke-width="2.5"/>
  <polygon points="856,206 856,222 870,214" fill="#718096"/>
  <text x="582" y="206" font-size="15" fill="#5a6a80">yes</text>
  <rect x="870" y="180" width="290" height="68" rx="10" fill="#f7f9fb" stroke="#94a3b8" stroke-width="2"/>
  <text x="1015" y="208" font-size="20" font-weight="bold" fill="#2d3748" text-anchor="middle">compaction cancelled</text>
  <text x="1015" y="230" font-size="15" fill="#5a6a80" text-anchor="middle">context left intact</text>

  <!-- A: retry (orange = the model call) -->
  <rect x="270" y="300" width="300" height="68" rx="10" fill="#fdeacc" stroke="#e8850c" stroke-width="2"/>
  <text x="420" y="328" font-size="20" font-weight="bold" fill="#9a4d00" text-anchor="middle">transient? retry</text>
  <text x="420" y="350" font-size="15" fill="#5a6a80" text-anchor="middle">resend the check request · 3 by default</text>

  <line x1="420" y1="368" x2="420" y2="390" stroke="#718096" stroke-width="2.5"/>
  <polygon points="412,390 428,390 420,404" fill="#718096"/>
  <text x="434" y="386" font-size="15" fill="#5a6a80">permanent / exhausted</text>

  <!-- B: opt-in gate 1 -->
  <rect x="270" y="404" width="300" height="68" rx="10" fill="#eefaf3" stroke="#22a06b" stroke-width="2"/>
  <text x="420" y="432" font-size="20" font-weight="bold" fill="#1e7a4c" text-anchor="middle">onFailure = draft?</text>
  <text x="420" y="454" font-size="15" fill="#5a6a80" text-anchor="middle">finalize the unchecked draft</text>

  <line x1="420" y1="472" x2="420" y2="494" stroke="#718096" stroke-width="2.5"/>
  <polygon points="412,494 428,494 420,508" fill="#718096"/>

  <!-- C: opt-in gate 2 -->
  <rect x="270" y="508" width="300" height="68" rx="10" fill="#eefaf3" stroke="#22a06b" stroke-width="2"/>
  <text x="420" y="536" font-size="20" font-weight="bold" fill="#1e7a4c" text-anchor="middle">fallbackToNative?</text>
  <text x="420" y="558" font-size="15" fill="#5a6a80" text-anchor="middle">false is what throws or cancels</text>

  <line x1="420" y1="576" x2="420" y2="598" stroke="#718096" stroke-width="2.5"/>
  <polygon points="412,598 428,598 420,612" fill="#718096"/>

  <!-- result: only when the fallback is switched off -->
  <rect x="270" y="612" width="300" height="68" rx="10" fill="#f7f9fb" stroke="#94a3b8" stroke-width="2"/>
  <text x="420" y="640" font-size="20" font-weight="bold" fill="#2d3748" text-anchor="middle">throw or cancel</text>
  <text x="420" y="662" font-size="15" fill="#5a6a80" text-anchor="middle">manual throws · auto cancels</text>

  <!-- red rail: gates leave at their right-edge center, merge at x=710, exit at y=490 -->
  <line x1="570" y1="438" x2="710" y2="438" stroke="#d64545" stroke-width="2.5"/>
  <text x="582" y="430" font-size="15" fill="#d64545">no</text>
  <line x1="570" y1="542" x2="710" y2="542" stroke="#d64545" stroke-width="2.5"/>
  <text x="582" y="534" font-size="15" fill="#d64545">no</text>
  <line x1="710" y1="438" x2="710" y2="542" stroke="#d64545" stroke-width="2.5"/>
  <line x1="710" y1="490" x2="856" y2="490" stroke="#d64545" stroke-width="2.5"/>
  <polygon points="856,482 856,498 870,490" fill="#d64545"/>

  <!-- the default outcome -->
  <rect x="870" y="446" width="290" height="88" rx="10" fill="#f7f9fb" stroke="#94a3b8" stroke-width="2"/>
  <text x="1015" y="474" font-size="20" font-weight="bold" fill="#2d3748" text-anchor="middle">pi compacts natively</text>
  <text x="1015" y="496" font-size="15" fill="#5a6a80" text-anchor="middle">plus a warning naming the cause</text>
  <text x="1015" y="518" font-size="15" fill="#5a6a80" text-anchor="middle">no prefix reuse this time, session intact</text>

  <text x="640" y="750" font-size="15" fill="#5a6a80" text-anchor="middle">Only a user cancel stops in place; every other failure degrades rather than stranding the session</text>
</svg>
