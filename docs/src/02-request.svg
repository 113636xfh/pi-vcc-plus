<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif">
  <rect x="0" y="0" width="1280" height="360" fill="#ffffff"/>

  <text x="640" y="52" font-size="26" font-weight="bold" fill="#1a202c" text-anchor="middle">检查请求的构成</text>
  <text x="640" y="86" font-size="15" fill="#5a6a80" text-anchor="middle">唯一的增量是尾部指令，之前全部逐字节复用</text>

  <!-- segment 1: reused prefix (green, large) -->
  <rect x="40" y="140" width="860" height="88" rx="10" fill="#eefaf3" stroke="#22a06b" stroke-width="2"/>
  <text x="470" y="170" font-size="20" font-weight="bold" fill="#1e7a4c" text-anchor="middle">前缀（逐字节复用）</text>
  <text x="470" y="198" font-size="15" fill="#5a6a80" text-anchor="middle">system + tools + messages（取自上一次真实请求）</text>

  <!-- segment 2: tail instruction (orange, the only new part) -->
  <rect x="900" y="140" width="340" height="88" rx="10" fill="#fdeacc" stroke="#e8850c" stroke-width="2"/>
  <text x="1070" y="170" font-size="20" font-weight="bold" fill="#9a4d00" text-anchor="middle">尾部指令</text>
  <text x="1070" y="198" font-size="15" fill="#5a6a80" text-anchor="middle">草稿 + 预算 + 补丁规则</text>

  <!-- caption: the consequence -->
  <text x="640" y="300" font-size="15" fill="#5a6a80" text-anchor="middle">前缀与上一次请求相同 → KV 缓存直接命中，只 prefill 新增尾部</text>
</svg>
